<!doctype html>
<html lang="en">
  <head>
    <!-- Basic document settings used by browsers and search engines. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerard Zhou is a UT Austin computer science student and software engineer building cloud infrastructure, Kubernetes automation, backend systems, and developer tools."
    />
    <meta name="author" content="Gerard Zhou" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1713" media="(prefers-color-scheme: dark)" />

    <!--
      The canonical URL tells search engines which address is authoritative.
      Keep it in sync if the portfolio ever moves to a custom domain.
    -->
    <link rel="canonical" href="https://gerardzhou.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph metadata controls previews in LinkedIn, Slack, and similar apps. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gerard Zhou" />
    <meta property="og:title" content="Gerard Zhou — Software Engineer" />
    <meta
      property="og:description"
      content="Reliable systems, thoughtful engineering, and an interactive developer portfolio."
    />
    <meta property="og:url" content="https://gerardzhou.github.io/" />
    <meta property="og:image" content="https://gerardzhou.github.io/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Gerard Zhou's software engineering portfolio"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter/X uses a parallel set of preview fields. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gerard Zhou — Software Engineer" />
    <meta
      name="twitter:description"
      content="Reliable systems, thoughtful engineering, and an interactive developer portfolio."
    />
    <meta name="twitter:image" content="https://gerardzhou.github.io/social-card.png" />
    <meta
      name="twitter:image:alt"
      content="Gerard Zhou's software engineering portfolio"
    />

    <!--
      JSON-LD is machine-readable profile data. It does not render on the page,
      but helps search engines connect the site with Gerard's public profiles.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Gerard Zhou",
        "url": "https://gerardzhou.github.io/",
        "email": "mailto:gerardzhou07@gmail.com",
        "jobTitle": "Software Engineer Intern",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "The University of Texas at Austin"
        },
        "sameAs": [
          "https://github.com/GerardZhou",
          "https://www.linkedin.com/in/gerard-zhou"
        ],
        "knowsAbout": [
          "Software engineering",
          "Cloud infrastructure",
          "Kubernetes",
          "Systems engineering",
          "Distributed systems",
          "Backend engineering",
          "Probability"
        ]
      }
    </script>
    <title>Gerard Zhou — Software Engineer</title>
  </head>
  <body>
    <!-- Keyboard users can reveal this link to jump past repeated navigation. -->
    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- React mounts the entire application inside this otherwise-empty element. -->
    <div id="root"></div>

    <!-- Vite follows this module import and bundles its TypeScript dependencies. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
